<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Shift check-in - ShelterLink</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <!-- preload:start -->
    <link rel="preload" href="/public/fonts/atkinson-hyperlegible-next-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/public/fonts/young-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="/js/kiosk.js">
    <link rel="modulepreload" href="/js/utils/dateFormat.js">
    <link rel="modulepreload" href="/js/utils/skipLink.js">
    <!-- preload:end -->
  </head>
  <body class="kiosk-body">
    <main class="kiosk-shell" id="main-content">
      <header class="kiosk-header">
        <div>
          <h1>Shift check-in</h1>
          <p class="muted" id="clockLabel">Today&rsquo;s shifts</p>
        </div>
        <button type="button" id="lockButton" class="secondary hidden">Lock</button>
      </header>

      <div id="message" role="status" aria-live="polite"></div>

      <section id="unlockPanel" class="kiosk-panel">
        <h2>Staff unlock</h2>
        <p class="muted">A member of staff signs in once to unlock this tablet for check-in.</p>
        <form id="unlockForm" class="code-form">
          <label>
            Email address
            <input type="email" id="unlockEmail" required autocomplete="username" />
          </label>
          <label>
            Password
            <input type="password" id="unlockPassword" required autocomplete="current-password" />
          </label>
          <button type="submit">Unlock kiosk</button>
        </form>
      </section>

      <section id="shiftsPanel" class="kiosk-panel hidden">
        <h2 id="shiftsHeading">Today&rsquo;s shifts</h2>
        <div id="shiftsList" class="shift-list">
          <p class="skeleton" aria-hidden="true"></p><p class="visually-hidden">Loading today&rsquo;s shifts</p>
        </div>
      </section>

      <section id="checkPanel" class="kiosk-panel hidden">
        <button type="button" id="backToShifts" class="secondary">Back</button>
        <h2 id="selectedVolunteerName">Volunteer</h2>
        <p id="selectedShiftTitle" class="muted"></p>
        <p id="checkActionHint"></p>
        <form id="codeForm" class="code-form">
          <label>
            Shift check-in code
            <input type="text" id="checkCode" maxlength="6" required autocomplete="off" inputmode="text" />
          </label>
          <button type="submit" id="submitCheck">Confirm</button>
        </form>
      </section>
    </main>

    <script type="module" src="/js/kiosk.js"></script>
  </body>
</html>
