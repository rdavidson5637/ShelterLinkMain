<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F5C45" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Forgot password - ShelterLink</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <!-- preload:start -->
    <link rel="preload" href="/public/fonts/atkinson-hyperlegible-next-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/public/fonts/young-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="/js/brand.js">
    <link rel="modulepreload" href="/js/brandCache.js">
    <link rel="modulepreload" href="/js/components/icons.js">
    <link rel="modulepreload" href="/js/components/publicNav.js">
    <link rel="modulepreload" href="/js/components/statusBanner.js">
    <link rel="modulepreload" href="/js/config.js">
    <link rel="modulepreload" href="/js/forgot-password.js">
    <link rel="modulepreload" href="/js/pwa.js">
    <link rel="modulepreload" href="/js/utils/footerYear.js">
    <link rel="modulepreload" href="/js/utils/forgotPasswordCopy.js">
    <link rel="modulepreload" href="/js/utils/formErrors.js">
    <link rel="modulepreload" href="/js/utils/skipLink.js">
    <!-- preload:end -->
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Main navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <ul class="nav-menu" id="navMenu">
          <li><a class="nav-link" href="/pages/opportunities.html">Open shifts</a></li>
          <li><a class="nav-link" href="/login.html">Sign in</a></li>
        </ul>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">Menu</button>
      </nav>
    </header>

    <main class="container">
      <div class="auth-card">
        <h1>Forgot your password?</h1>
        <p class="lead">Enter the email address you signed up with. We will send a link to set a new password.</p>

        <div id="message" role="status" aria-live="polite"></div>

        <form id="forgotForm">
          <label for="email">
            Email address
            <input type="email" id="email" name="email" required autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" />
          </label>
          <button type="submit" id="submitButton">Send reset link</button>
        </form>

        <p class="auth-links muted">
          Remembered it? <a href="/login.html">Sign in</a>
        </p>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/components/publicNav.js"></script>
    <script type="module" src="/js/forgot-password.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
