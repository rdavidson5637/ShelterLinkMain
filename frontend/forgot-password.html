<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Main navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
      </nav>
    </header>

    <main class="container">
      <article class="auth-card">
        <h1>Forgot Password</h1>
        <p>Enter your email address and we'll send you a link to reset your password.</p>

        <div id="message" role="status" aria-live="polite"></div>

        <form id="forgotForm">
          <label for="email">
            Email Address
            <input type="email" id="email" name="email" required autocomplete="email" />
          </label>
          <button type="submit" id="submitButton">Send Reset Link</button>
        </form>

        <p class="auth-links">
          Remembered your password? <a href="/login.html">Sign In</a>
        </p>
      </article>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink : Assisi Animal Sanctuary</small>
    </footer>

    <script>
      (() => {
        const nav = document.querySelector('.site-nav');
        const toggle = nav?.querySelector('.nav-toggle');
        if (!nav || !toggle) return;
        toggle.addEventListener('click', () => {
          const open = nav.classList.toggle('nav-open');
          toggle.setAttribute('aria-expanded', String(open));
        });
      })();
    </script>
    <script type="module">
      import { apiRequest } from '/js/config.js';
      import { showFormErrors, clearFormErrors } from '/js/utils/formErrors.js';
      import { forgotPasswordFeedback } from '/js/utils/forgotPasswordCopy.js';

      const form = document.getElementById('forgotForm');
      const messageEl = document.getElementById('message');
      const submitButton = document.getElementById('submitButton');

      function showMessage(text, type = 'info') {
        const color = type === 'error' ? '#d93025' : type === 'success' ? '#0f9d58' : '#1a73e8';
        const p = document.createElement('p');
        p.style.cssText = `color:${color};padding:0.75rem;border-radius:6px;background:${color}18;`;
        p.textContent = text;
        messageEl.replaceChildren(p);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFormErrors(form);
        const email = document.getElementById('email').value.trim();
        if (!email) {
          showFormErrors(form, [{ field: 'email', message: 'Enter your email address.' }]);
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Sending…';
        messageEl.replaceChildren();

        try {
          const res = await apiRequest('/auth/forgot-password', {
            method: 'POST',
            body: { email },
          });

          const data = await res.json().catch(() => ({}));
          const feedback = forgotPasswordFeedback(res, data);
          showMessage(feedback.text, feedback.type);
          if (feedback.hideForm) {
            form.style.display = 'none';
          } else {
            submitButton.disabled = false;
            submitButton.textContent = 'Send Reset Link';
          }
        } catch (err) {
          showFormErrors(form, [{ message: 'Network error. Please check your connection and try again.' }]);
          submitButton.disabled = false;
          submitButton.textContent = 'Send Reset Link';
        }
      });
    </script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
