<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review applications - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Review Applications</h1>
        <p>Approve or reject volunteer applications.</p>
      </section>

      <section>
        <label for="statusFilter" style="max-width: 240px;">
          Filter by status
          <select id="statusFilter" name="status">
            <option value="pending" selected>Pending</option>
            <option value="waitlisted">Waitlisted</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
            <option value="all">All</option>
          </select>
        </label>
      </section>

      <section>
        <div id="message" role="status" aria-live="polite"></div>
        <div class="table-wrapper directory-table">
          <table>
            <caption>Volunteer applications</caption>
            <thead>
              <tr>
                <th scope="col">Volunteer</th>
                <th scope="col">Opportunity</th>
                <th scope="col">Applied</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="applicationsTableBody"></tbody>
          </table>
        </div>
        <div id="applicationsCardList" class="directory-cards"></div>
      </section>
      </div>
    </main>

    <!-- Reject Notes Modal -->
    <dialog id="notesModal" aria-labelledby="reject-modal-title">
      <article>
        <header>
          <strong id="reject-modal-title">Add Notes for Rejection</strong>
        </header>
        <p>Please provide optional notes for the volunteer.</p>
        <label for="rejectNotes">
          Notes
          <textarea id="rejectNotes" rows="3" placeholder="Reason for rejection (optional)"></textarea>
        </label>
        <footer style="display: flex; gap: 0.5rem; justify-content: flex-end;">
          <button id="cancelModalButton" class="secondary button-secondary">Cancel</button>
          <button id="submitModalButton" class="contrast">Submit</button>
        </footer>
      </article>
    </dialog>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/review-applications.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
