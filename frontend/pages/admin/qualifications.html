<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qualifications - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Qualifications &amp; training</h1>
        <p>Define training requirements that can gate volunteer shifts. Leave validity blank for qualifications that never expire.</p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section>
        <article style="max-width: 720px;">
          <h2 id="formTitle">Add qualification</h2>
          <form id="qualificationForm">
            <input type="hidden" id="qualification_id" />
            <label for="name">
              Name
              <input type="text" id="name" name="name" required maxlength="255" />
            </label>
            <label for="description">
              Description
              <textarea id="description" name="description" rows="3"></textarea>
            </label>
            <label for="validity_months">
              Validity (months)
              <input type="number" id="validity_months" name="validity_months" min="1" placeholder="Leave blank = never expires" />
            </label>
            <div class="opportunity-actions">
              <button type="submit" id="saveButton">Save</button>
              <button type="button" id="cancelEditButton" class="secondary" hidden>Cancel edit</button>
            </div>
          </form>
        </article>
      </section>

      <section>
        <h2>All qualifications</h2>
        <div class="table-wrapper">
          <table>
            <caption>Qualifications</caption>
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Description</th>
                <th scope="col">Validity</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="qualificationsTableBody">
              <tr><td colspan="4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2025 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/qualifications.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
