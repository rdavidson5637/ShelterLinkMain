<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day sheet - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <style>
      .day-sheet-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: end;
        margin-bottom: 1.5rem;
      }
      .day-sheet-shift {
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #ccc;
      }
      .day-sheet-shift h2 {
        margin-bottom: 0.25rem;
      }
      .day-sheet-meta {
        color: #444;
        margin-bottom: 0.75rem;
      }
      .day-sheet-notes {
        min-height: 4.5rem;
        border: 1px solid #bbb;
        border-radius: 2px;
        background:
          repeating-linear-gradient(
            transparent,
            transparent 1.35rem,
            #ddd 1.35rem,
            #ddd calc(1.35rem + 1px)
          );
        margin-top: 0.75rem;
      }
      .handling-warn {
        color: #7a1f1f;
        font-weight: 600;
      }
      .day-sheet-animals {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .day-sheet-animal {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .animal-thumb {
        width: 3rem;
        height: 3rem;
        object-fit: cover;
        border-radius: 4px;
        flex-shrink: 0;
      }
      @media print {
        .site-header,
        .sidebar-nav,
        .day-sheet-toolbar,
        .nav-toggle,
        #logoutButton,
        footer,
        .no-print {
          display: none !important;
        }
        body {
          background: #fff;
        }
        main.container,
        .dashboard-layout,
        .dashboard-main {
          display: block;
          max-width: none;
          margin: 0;
          padding: 0;
        }
        .day-sheet-shift {
          page-break-after: always;
          border: none;
        }
        .day-sheet-shift:last-child {
          page-break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
        <section>
          <h1>Day sheet</h1>
          <p>Printable roster for the day — accepted volunteers, check-in codes, and handling notes.</p>
          <div id="message" role="status" aria-live="polite"></div>
        </section>

        <section class="day-sheet-toolbar no-print">
          <label for="sheetDate">
            Date
            <input type="date" id="sheetDate" />
          </label>
          <button type="button" id="loadButton">Load</button>
          <button type="button" id="printButton" class="secondary">Print</button>
        </section>

        <section id="daySheetContent" aria-live="polite">
          <p>Pick a date and load the roster.</p>
        </section>
      </div>
    </main>

    <footer class="container">
      <small>&copy; <span data-footer-year></span> ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/day-sheet.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
    <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
