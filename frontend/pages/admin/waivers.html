<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waivers - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Waivers</h1>
        <p>Create and update electronic waivers. Editing the text bumps the version; with re-acceptance enabled, volunteers must accept again.</p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section>
        <article style="max-width: 720px;">
          <h2 id="formTitle">Add waiver</h2>
          <form id="waiverForm">
            <input type="hidden" id="waiver_id" />
            <label for="title">
              Title
              <input type="text" id="title" name="title" required maxlength="255" />
            </label>
            <label for="body">
              Waiver text
              <textarea id="body" name="body" rows="12" required></textarea>
            </label>
            <label>
              <input type="checkbox" id="active" name="active" checked />
              Active
            </label>
            <label>
              <input type="checkbox" id="requires_reacceptance" name="requires_reacceptance" checked />
              Require re-acceptance when text changes
            </label>
            <div class="opportunity-actions">
              <button type="submit" id="saveButton">Save</button>
              <button type="button" id="cancelEditButton" class="secondary" hidden>Cancel edit</button>
            </div>
          </form>
        </article>
      </section>

      <section>
        <h2>All waivers</h2>
        <div class="table-wrapper">
          <table>
            <caption>Waivers</caption>
            <thead>
              <tr>
                <th scope="col">Title</th>
                <th scope="col">Version</th>
                <th scope="col">Active</th>
                <th scope="col">Re-accept</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="waiversTableBody">
              <tr><td colspan="5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/waivers.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
