<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Threads - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <link rel="stylesheet" href="/public/css/threads.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
        <section>
          <h1>Messages</h1>
          <p>
            Oversight of shift chats and announcements.
            <a href="/pages/admin/messages.html">Bulk email</a> remains available for one-way blasts.
          </p>
          <div id="message" role="status" aria-live="polite"></div>
        </section>

        <section class="announcement-form-section">
          <details>
            <summary>Post an announcement</summary>
            <form id="announcementForm" class="announcement-form">
              <label>
                Subject
                <input type="text" id="announcementSubject" name="subject" maxlength="255" required />
              </label>
              <label>
                Message
                <textarea id="announcementBody" name="body" rows="4" maxlength="2000" required></textarea>
              </label>
              <button type="submit">Create announcement</button>
            </form>
          </details>
        </section>

        <section class="threads-layout" aria-label="Message threads">
          <aside class="threads-list-panel">
            <h2 class="threads-panel-heading">All threads</h2>
            <div id="threadsList" class="threads-list"></div>
          </aside>
          <div class="threads-detail-panel">
            <div id="threadEmpty" class="threads-empty">
              <p>Select a thread to moderate.</p>
            </div>
            <div id="threadView" class="thread-view" hidden>
              <header class="thread-view-header">
                <div>
                  <h2 id="threadSubject"></h2>
                  <p id="threadMeta" class="threads-meta"></p>
                </div>
                <button type="button" id="muteButton" class="secondary">Mute</button>
              </header>
              <div id="participants" class="thread-participants" aria-label="Participants"></div>
              <div id="messagesList" class="messages-list" role="log" aria-live="polite"></div>
              <form id="composeForm" class="compose-form">
                <label for="composeBody">
                  Reply
                  <textarea id="composeBody" name="body" rows="3" maxlength="2000" required placeholder="Write a message (max 2000 characters)"></textarea>
                </label>
                <button type="submit" id="sendButton">Send</button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="container">
      <small>&copy; <span data-year></span> ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/threads.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
    <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
