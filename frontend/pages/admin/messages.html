<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulk messages - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Bulk messaging</h1>
        <p>Email volunteers using filters. Messages are sent individually (no CC).</p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section>
        <form id="messageForm">
          <div class="form-grid">
            <label>
              Profile status
              <select id="profileStatus" name="profileStatus">
                <option value="">Any</option>
                <option value="approved">Approved</option>
                <option value="pending">Pending</option>
              </select>
            </label>
            <label>
              Skill contains
              <input type="text" id="skill" name="skill" placeholder="e.g. dogs" />
            </label>
            <label>
              Min approved hours
              <input type="number" id="minApprovedHours" name="minApprovedHours" min="0" step="0.5" />
            </label>
            <label>
              Applied to opportunity ID
              <input type="number" id="opportunityId" name="opportunityId" min="1" />
            </label>
            <label class="form-full-width">
              Subject
              <input type="text" id="subject" name="subject" required />
            </label>
            <label class="form-full-width">
              Message
              <textarea id="body" name="body" rows="6" required></textarea>
            </label>
          </div>
          <p>Matching recipients: <strong id="recipientCount">0</strong></p>
          <button type="submit" id="sendButton">Send message</button>
        </form>
      </section>

      <section>
        <h2>Send history</h2>
        <div class="table-wrapper">
          <table>
            <caption>Message send history</caption>
            <thead>
              <tr>
                <th scope="col">When</th>
                <th scope="col">Subject</th>
                <th scope="col">Recipients</th>
                <th scope="col">Admin</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <tr><td colspan="4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2025 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/messages.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
