<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shift feedback - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <style>
      tr.concern-open {
        background: rgba(180, 60, 40, 0.08);
      }
      tr.concern-open td:first-child {
        box-shadow: inset 4px 0 0 #b43c28;
      }
      .avg-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .avg-list li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--pico-muted-border-color, #ddd);
      }
    </style>
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Shift feedback</h1>
        <p>Ratings and concerns from volunteers after their shifts.</p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section class="grid">
        <article>
          <header><strong>Overall average</strong></header>
          <p id="overallAverage" class="stat-value" style="font-size: 2rem; font-weight: bold;">:</p>
          <p id="overallCount" class="muted">0 ratings</p>
        </article>
        <article>
          <header><strong>By opportunity</strong></header>
          <ul class="avg-list" id="byOpportunityList">
            <li>Loading…</li>
          </ul>
        </article>
      </section>

      <section>
        <h2>Filters</h2>
        <form id="filtersForm">
          <div class="form-grid">
            <label>
              Opportunity ID
              <input type="number" id="filterOpportunityId" min="1" />
            </label>
            <label>
              Min rating
              <select id="filterMinRating">
                <option value="">Any</option>
                <option value="1">1+</option>
                <option value="2">2+</option>
                <option value="3">3+</option>
                <option value="4">4+</option>
                <option value="5">5</option>
              </select>
            </label>
            <label>
              Concerns
              <select id="filterFlagConcern">
                <option value="">Any</option>
                <option value="true">Flagged only</option>
                <option value="false">Not flagged</option>
              </select>
            </label>
            <label>
              Handled
              <select id="filterHandled">
                <option value="">Any</option>
                <option value="false">Open concerns</option>
                <option value="true">Handled</option>
              </select>
            </label>
          </div>
          <button type="submit">Apply filters</button>
          <button type="button" id="clearFiltersButton" class="secondary">Clear</button>
        </form>
      </section>

      <section>
        <h2>Feedback list</h2>
        <div class="table-wrapper">
          <table>
            <caption>Shift feedback</caption>
            <thead>
              <tr>
                <th scope="col">When</th>
                <th scope="col">Volunteer</th>
                <th scope="col">Opportunity</th>
                <th scope="col">Rating</th>
                <th scope="col">Comment</th>
                <th scope="col">Concern</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="feedbackTableBody">
              <tr><td colspan="7">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/feedback.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
