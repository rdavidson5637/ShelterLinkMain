<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>No-show follow-up - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <style>
      .no-show-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      .no-show-actions button {
        margin: 0;
      }
      .email-panel {
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--pico-muted-border-color, #ddd);
      }
      .email-panel textarea {
        min-height: 4.5rem;
        margin-bottom: 0.5rem;
      }
      .email-panel .row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main id="main" class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
        <section>
          <h1>No-show follow-up</h1>
          <p>Recent missed shifts in this shelter. Mark contacted after you speak with the volunteer, or send a short follow-up email when you choose to.</p>
          <div id="message" role="status" aria-live="polite"></div>
        </section>

        <section>
          <h2>Filters</h2>
          <form id="filtersForm">
            <div class="form-grid">
              <label>
                Status
                <select id="filterContacted">
                  <option value="open" selected>Not contacted</option>
                  <option value="contacted">Contacted</option>
                  <option value="all">All</option>
                </select>
              </label>
              <label>
                Last days
                <input type="number" id="filterDays" min="1" max="365" value="90" />
              </label>
            </div>
            <div class="form-actions">
              <button type="submit">Apply</button>
              <button type="button" id="clearFiltersButton" class="secondary">Clear</button>
            </div>
          </form>
        </section>

        <section>
          <h2>Queue</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Volunteer</th>
                  <th scope="col">Shift</th>
                  <th scope="col">Date</th>
                  <th scope="col">Follow-up</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="noShowTableBody">
                <tr><td colspan="5">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p><small>&copy; <span data-year></span> ShelterLink</small></p>
      </div>
    </footer>

    <script src="/js/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/no-shows.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
    <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
