<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve hours - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Approve Volunteer Hours</h1>
        <p>Review and approve pending volunteer hour submissions.</p>
      </section>

      <div id="message" role="status" aria-live="polite"></div>

      <section>
        <div style="margin-bottom: 1rem;">
          <label>
            <input type="checkbox" id="selectAllCheckbox" />
            Select All
          </label>
          <button id="bulkApproveButton" class="secondary" style="margin-left: 1rem;">Bulk Approve Selected</button>
        </div>

        <table>
            <caption>Hours awaiting approval</caption>
          <thead>
            <tr>
              <th scope="col" style="width: 3rem;">
                <input type="checkbox" id="headerCheckbox" aria-label="Select all hours" />
              </th>
              <th scope="col">Volunteer Name</th>
              <th scope="col">Opportunity</th>
              <th scope="col">Date</th>
              <th scope="col">Hours</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="hoursTableBody">
            <tr>
              <td colspan="6">Loading...</td>
            </tr>
          </tbody>
        </table>
      </section>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2025 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/approve-hours.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
