  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main people-page">
      <h1>Hours to approve</h1>
      <p>Review hour logs before they are counted.</p>

      <div id="message" role="status" aria-live="polite"></div>

      <section class="ruled-panel" aria-labelledby="hoursHeading">
        <header class="ruled-panel-head">
          <h2 id="hoursHeading">Waiting for approval</h2>
        </header>
        <div class="ruled-panel-body">
        <div class="people-toolbar">
          <label>
            <input type="checkbox" id="selectAllCheckbox" />
            Select all
          </label>
          <button id="bulkApproveButton" type="button" disabled>Approve selected</button>
        </div>

        <table class="people-stack">
            <caption class="visually-hidden">Hours awaiting approval</caption>
          <thead>
            <tr>
              <th scope="col">
                <input type="checkbox" id="headerCheckbox" aria-label="Select all hours" />
              </th>
              <th scope="col">Volunteer</th>
              <th scope="col">Opportunity</th>
              <th scope="col">Date</th>
              <th scope="col">Hours</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="hoursTableBody">
            <tr>
              <td colspan="6"><span class="skeleton" aria-hidden="true"></span><span class="visually-hidden">Loading</span></td>
            </tr>
          </tbody>
        </table>
        </div>
      </section>
      </div>
    </main>
