<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group Bookings | ShelterLink Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Admin navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation">☰</button>
        <ul class="nav-menu" id="navMenu">
          <li><a class="nav-link" href="/pages/admin/dashboard.html"><span class="nav-icon" aria-hidden="true">&#8962;</span><span>Dashboard</span></a></li>
          <li><a class="nav-link" href="/pages/admin/group-bookings.html" aria-current="page"><span class="nav-icon" aria-hidden="true">&#128101;</span><span>Groups</span></a></li>
          <li><a class="nav-link" href="/pages/admin/volunteers.html"><span class="nav-icon" aria-hidden="true">&#128100;</span><span>Volunteers</span></a></li>
          <li><a class="nav-link" href="/kiosk" target="_blank" rel="noopener"><span class="nav-icon" aria-hidden="true">&#128241;</span><span>Kiosk</span></a></li>
          <li><button id="logoutButton" class="secondary">Logout</button></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section>
        <h1>Group bookings</h1>
        <p>Confirm or decline company and school group requests. Confirmed size counts against capacity.</p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section>
        <label for="statusFilter">
          Status
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="pending" selected>Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
      </section>

      <section>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Group</th>
                <th>Opportunity</th>
                <th>Contact</th>
                <th>Size</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr><td colspan="6">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="container">
      <small>&copy; 2025 ShelterLink</small>
    </footer>

    <script>
      (() => {
        const nav = document.querySelector('.site-nav');
        const toggle = nav?.querySelector('.nav-toggle');
        if (!nav || !toggle) return;
        toggle.addEventListener('click', () => {
          const open = nav.classList.toggle('nav-open');
          toggle.setAttribute('aria-expanded', String(open));
        });
      })();
    </script>
    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/group-bookings.js"></script>
  </body>
</html>
