  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Group bookings</h1>
        <p>Confirm or decline company and school group requests. Confirmed size counts against capacity.</p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section>
        <label for="statusFilter">
          Status
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="pending" selected>Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
      </section>

      <section>
        <div class="table-wrapper">
          <table tabindex="0">
            <caption>Group booking requests</caption>
            <thead>
              <tr>
                <th scope="col">Group</th>
                <th scope="col">Shift</th>
                <th scope="col">Contact</th>
                <th scope="col">Size</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr><td colspan="6"><span class="skeleton" aria-hidden="true"></span></td></tr>
            </tbody>
          </table>
        </div>
      </section>
      </div>
    </main>
