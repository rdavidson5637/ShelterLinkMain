<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volunteer directory - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Volunteer Directory</h1>
      </section>

      <!-- Filter Section -->
      <section>
        <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 1rem;">
          <label for="searchInput">
            Search by name or email
            <input type="text" id="searchInput" name="search" placeholder="Search volunteers..." />
          </label>
          <label for="statusFilter">
            Filter by approval status
            <select id="statusFilter" name="status">
              <option value="all">All</option>
              <option value="approved">Approved</option>
              <option value="pending">Pending</option>
            </select>
          </label>
        </div>
      </section>

      <!-- Volunteers Table -->
      <section>
        <div id="message" role="status" aria-live="polite"></div>
        <div class="table-wrapper directory-table">
          <table>
            <caption>Registered volunteers</caption>
            <thead>
              <tr>
                <th scope="col">Volunteer</th>
                <th scope="col">Phone</th>
                <th scope="col">Status</th>
                <th scope="col">Total hours</th>
                <th scope="col">No-shows</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="volunteersTableBody">
              <tr><td colspan="6">Loading volunteers...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="volunteersCardList" class="directory-cards"></div>
      </section>
      </div>
    </main>

    <!-- Profile Modal -->
    <dialog id="profileModal" aria-labelledby="profile-modal-title">
      <article>
        <header>
          <strong id="profile-modal-title">Volunteer Profile</strong>
          <button aria-label="Close" rel="prev" id="closeModalButton" class="close"></button>
        </header>
        <div id="profileContent">
          <p>Loading profile...</p>
        </div>
        <footer>
          <button id="closeModalFooterButton" class="secondary button-secondary">Close</button>
        </footer>
      </article>
    </dialog>

    <!-- Award Qualification Modal -->
    <dialog id="awardModal" aria-labelledby="award-modal-title">
      <article>
        <header>
          <strong id="award-modal-title">Award qualification</strong>
          <button aria-label="Close" rel="prev" id="closeAwardModalButton" class="close"></button>
        </header>
        <form id="awardForm">
          <input type="hidden" id="awardUserId" />
          <p id="awardVolunteerName"></p>
          <label for="awardQualificationId">
            Qualification
            <select id="awardQualificationId" required>
              <option value="">Select...</option>
            </select>
          </label>
          <label for="awardDate">
            Awarded on
            <input type="date" id="awardDate" required />
          </label>
          <p id="awardExpiryHint" class="secondary"></p>
          <footer style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <button type="submit" id="awardSubmitButton">Award</button>
            <button type="button" id="closeAwardModalFooterButton" class="secondary">Cancel</button>
          </footer>
        </form>
      </article>
    </dialog>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/volunteers.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
