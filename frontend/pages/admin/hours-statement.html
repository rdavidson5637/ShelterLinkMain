<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hours statement - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <style>
      .cert-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
        margin: 1rem 0 1.5rem;
      }
      .cert-actions label {
        margin: 0;
      }
      .hours-statement-sheet {
        background: var(--surface, #fff);
        color: var(--text, #1f2937);
        border: 1px solid var(--green-tint-border, #99f6e4);
        padding: 2rem 2.25rem;
        max-width: 210mm;
        margin: 0 auto;
      }
      .hours-statement-header {
        display: flex;
        gap: 1.25rem;
        align-items: center;
        margin-bottom: 1.25rem;
      }
      .hours-statement-logo {
        width: 4.5rem;
        height: 4.5rem;
        object-fit: contain;
        flex-shrink: 0;
      }
      .shelter-name {
        font-family: var(--font-display);
        font-size: var(--text-xl);
        font-weight: 600;
        margin: 0;
        line-height: var(--leading-heading);
      }
      .statement-title {
        margin: 0.15rem 0 0;
        color: var(--text-secondary, #5b6670);
      }
      .lede {
        max-width: 65ch;
        line-height: 1.6;
        margin: 0 0 1.25rem;
      }
      .statement-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: 0.75rem 1.5rem;
        margin: 0 0 1.5rem;
      }
      .statement-meta dt {
        font-size: var(--text-sm);
        color: var(--text-secondary, #5b6670);
        margin: 0;
      }
      .statement-meta dd {
        margin: 0.15rem 0 0;
        font-weight: 600;
      }
      .hours-statement-table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 1.5rem;
      }
      .hours-statement-table th,
      .hours-statement-table td {
        border-bottom: 1px solid var(--green-tint-border, #99f6e4);
        padding: 0.5rem 0.35rem;
        text-align: left;
        vertical-align: top;
      }
      .hours-statement-table .num {
        text-align: right;
        white-space: nowrap;
      }
      .shift-location {
        font-size: var(--text-sm);
        color: var(--text-secondary, #5b6670);
      }
      .statement-signoff {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--green-tint-border, #99f6e4);
      }
      .statement-signoff .muted {
        color: var(--text-secondary, #5b6670);
        font-size: var(--text-sm);
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 14mm;
        }
        body {
          background: #fff !important;
        }
        .site-header,
        .sidebar-nav,
        .cert-actions,
        footer,
        .no-print,
        .nav-toggle,
        #logoutButton {
          display: none !important;
        }
        main.container,
        .dashboard-layout,
        .dashboard-main {
          display: block;
          max-width: none;
          margin: 0;
          padding: 0;
        }
        .hours-statement-sheet {
          border: none;
          padding: 0;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header no-print">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main id="main" class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav no-print"></aside>
      <div class="dashboard-main">
        <section class="no-print">
          <h1>Hours statement</h1>
          <p id="introText">
            Issue a printable hours statement for school, Duke of Edinburgh, or employment references.
          </p>
          <form id="rangeForm" class="cert-actions">
            <label for="startDate">
              From
              <input type="date" id="startDate" name="startDate" required />
            </label>
            <label for="endDate">
              To
              <input type="date" id="endDate" name="endDate" required />
            </label>
            <button type="submit" id="loadButton">Show statement</button>
            <button type="button" id="printButton" class="secondary" hidden>Print</button>
            <a href="/pages/admin/volunteers.html" role="button" class="secondary outline">Back to volunteers</a>
          </form>
          <div id="message" role="status" aria-live="polite"></div>
        </section>

        <article id="statementSheet" class="hours-statement-sheet" hidden></article>
      </div>
    </main>

    <footer class="container no-print">
      <small>&copy; <span data-footer-year></span> ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/hours-statement.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
    <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
