<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b5e20" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Audit log - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="admin-nav" aria-label="Toggle navigation">Menu</button>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container dashboard-layout">
      <aside id="admin-nav" class="sidebar-nav"></aside>
      <div class="dashboard-main">
      <section>
        <h1>Audit log</h1>
        <p>Mutating staff and admin actions recorded by the server.</p>
      </section>

      <section>
        <form id="filterForm" class="grid" style="grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1rem;">
          <label>
            Action
            <input type="text" name="action" id="filterAction" placeholder="e.g. hours.approve" />
          </label>
          <label>
            Entity type
            <input type="text" name="entityType" id="filterEntityType" placeholder="e.g. volunteer" />
          </label>
          <label>
            Actor user id
            <input type="number" name="userId" id="filterUserId" min="1" />
          </label>
          <label>
            From
            <input type="date" name="from" id="filterFrom" />
          </label>
          <label>
            To
            <input type="date" name="to" id="filterTo" />
          </label>
          <div style="align-self: end;">
            <button type="submit">Apply filters</button>
          </div>
        </form>
      </section>

      <section id="message"></section>

      <section class="table-wrapper">
        <table>
            <caption>Audit log</caption>
          <thead>
            <tr>
              <th scope="col">When</th>
              <th scope="col">Actor</th>
              <th scope="col">Action</th>
              <th scope="col">Entity</th>
              <th scope="col">Detail</th>
            </tr>
          </thead>
          <tbody id="auditTableBody">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </section>
      </div>
    </main>

    <footer class="container" data-site-footer></footer>
<script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/admin/audit-log.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/adminNav.js"></script>
  </body>
</html>
