<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Provide a reference - ShelterLink</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <!-- preload:start -->
    <link rel="preload" href="/public/fonts/atkinson-hyperlegible-next-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/public/fonts/young-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="/js/brand.js">
    <link rel="modulepreload" href="/js/brandCache.js">
    <link rel="modulepreload" href="/js/components/statusBanner.js">
    <link rel="modulepreload" href="/js/config.js">
    <link rel="modulepreload" href="/js/public/reference.js">
    <link rel="modulepreload" href="/js/pwa.js">
    <link rel="modulepreload" href="/js/utils/footerYear.js">
    <link rel="modulepreload" href="/js/utils/skipLink.js">
    <!-- preload:end -->
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Public">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
      </nav>
    </header>

    <main class="container auth-card auth-card--wide">
      <h1>Volunteer reference</h1>
      <p id="intro" class="lead"><span class="skeleton" aria-hidden="true"></span><span class="visually-hidden">Loading the reference request</span></p>
      <div id="message" role="status" aria-live="polite"></div>

      <form id="referenceForm" hidden>
        <fieldset>
          <legend>Is this person suitable to volunteer with animals and the public?</legend>
          <label class="check">
            <input type="radio" name="is_suitable" value="1" required />
            Yes, suitable
          </label>
          <label class="check">
            <input type="radio" name="is_suitable" value="0" />
            No, not suitable
          </label>
        </fieldset>
        <label for="comments">
          Comments
          <textarea id="comments" name="comments" rows="5" maxlength="5000" aria-describedby="commentsHint"></textarea>
          <small id="commentsHint" class="hint">Confidential. The volunteer does not see this.</small>
        </label>
        <p class="actions">
          <button type="submit">Send reference</button>
          <button type="button" id="declineButton" class="secondary">Decline to give a reference</button>
        </p>
      </form>
    </main>

    <footer class="container">
      <small>&copy; ShelterLink</small>
    </footer>

    <script type="module" src="/js/public/reference.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
