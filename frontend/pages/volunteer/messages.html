<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F5C45" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Messages - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <link rel="stylesheet" href="/public/css/threads.css" />
    <!-- preload:start -->
    <link rel="preload" href="/public/fonts/atkinson-hyperlegible-next-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/public/fonts/young-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="/js/auth.js">
    <link rel="modulepreload" href="/js/authMe.js">
    <link rel="modulepreload" href="/js/brand.js">
    <link rel="modulepreload" href="/js/brandCache.js">
    <link rel="modulepreload" href="/js/components/accountMenu.js">
    <link rel="modulepreload" href="/js/components/icons.js">
    <link rel="modulepreload" href="/js/components/navConfig.js">
    <link rel="modulepreload" href="/js/components/statusBanner.js">
    <link rel="modulepreload" href="/js/components/threadsUi.js">
    <link rel="modulepreload" href="/js/components/volunteerNav.js">
    <link rel="modulepreload" href="/js/config.js">
    <link rel="modulepreload" href="/js/pwa.js">
    <link rel="modulepreload" href="/js/utils/apiErrorPolicy.js">
    <link rel="modulepreload" href="/js/utils/errorHandler.js">
    <link rel="modulepreload" href="/js/utils/footerYear.js">
    <link rel="modulepreload" href="/js/utils/roles.js">
    <link rel="modulepreload" href="/js/utils/sessionManager.js">
    <link rel="modulepreload" href="/js/utils/skipLink.js">
    <link rel="modulepreload" href="/js/volunteer/messages.js">
    <!-- preload:end -->
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Volunteer navigation">
        <a class="site-brand" href="/pages/volunteer/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <ul class="nav-menu" id="navMenu" data-volunteer-nav></ul>
        <button id="logoutButton" class="secondary">Sign out</button>
      </nav>
    </header>

    <main class="container">
      <section>
        <h1>Messages</h1>
        <p>Shift chats and shelter announcements. Other volunteers see your name only, never your contact details.</p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section class="threads-layout" aria-label="Message threads">
        <aside class="threads-list-panel">
          <h2 class="threads-panel-heading">Threads</h2>
          <div id="threadsList" class="threads-list"></div>
        </aside>
        <div class="threads-detail-panel">
          <div id="threadEmpty" class="threads-empty">
            <p>Select a thread to read and reply.</p>
          </div>
          <div id="threadView" class="thread-view" hidden>
            <header class="thread-view-header">
              <div>
                <h2 id="threadSubject"></h2>
                <p id="threadMeta" class="threads-meta"></p>
              </div>
              <button type="button" id="muteButton" class="secondary">Mute</button>
            </header>
            <div id="participants" class="thread-participants" aria-label="Participants"></div>
            <div id="messagesList" class="messages-list" role="log" aria-live="polite"></div>
            <form id="composeForm" class="compose-form">
              <label for="composeBody">
                Reply
                <textarea id="composeBody" name="body" rows="3" maxlength="2000" required placeholder="Write a message (max 2000 characters)"></textarea>
              </label>
              <button type="submit" id="sendButton">Send</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="container">
      <small>&copy; <span data-year></span> ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/volunteer/messages.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
    <script type="module" src="/js/components/volunteerNav.js"></script>
  </body>
</html>
