<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My applications - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <link rel="stylesheet" href="/public/css/confirm-dialog.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Volunteer navigation">
        <a class="site-brand" href="/pages/volunteer/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation">Menu</button>
        <ul class="nav-menu" id="navMenu" data-volunteer-nav></ul>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container">
      <section>
        <h1>My Applications</h1>
        <p>Track the status of your volunteer shift applications.</p>
      </section>

      <section aria-label="Filter applications">
        <div id="filterTabs" class="tabs">
          <button type="button" data-status="all" class="secondary">All</button>
          <button type="button" data-status="pending" class="secondary">Pending</button>
          <button type="button" data-status="waitlisted" class="secondary">Waitlisted</button>
          <button type="button" data-status="approved" class="secondary">Approved</button>
          <button type="button" data-status="rejected" class="secondary">Rejected</button>
          <button type="button" data-status="cancelled" class="secondary">Cancelled</button>
        </div>
      </section>

      <section>
        <div id="applications-container"></div>
      </section>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/volunteer/my-applications.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/volunteerNav.js"></script>
  </body>
</html>
