<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b5e20" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Foster - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Volunteer navigation">
        <a class="site-brand" href="/pages/volunteer/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation">Menu</button>
        <ul class="nav-menu" id="navMenu" data-volunteer-nav></ul>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container">
      <section>
        <h1>Foster</h1>
        <p>Matched foster requests and your placements. Complete foster home details on your profile if you want to help.</p>
        <div id="message" role="status" aria-live="polite"></div>
        <article id="emergencyBanner" class="status-banner" hidden>
          <p><strong>Shelter emergency phone:</strong> <span id="emergencyPhone"></span></p>
        </article>
      </section>

      <section>
        <h2>Matching requests</h2>
        <div id="matchingList">Loading…</div>
      </section>

      <section>
        <h2>My placements</h2>
        <div id="placementsList">Loading…</div>
      </section>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink : Assisi Animal Sanctuary</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/volunteer/foster.js"></script>
    <script type="module" src="/js/bindLogout.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
    <script type="module" src="/js/components/volunteerNav.js"></script>
  </body>
</html>
