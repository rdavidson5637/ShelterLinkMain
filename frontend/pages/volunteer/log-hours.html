<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log hours - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Volunteer navigation">
        <a class="site-brand" href="/pages/volunteer/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation">Menu</button>
        <ul class="nav-menu" id="navMenu" data-volunteer-nav></ul>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container">
      <section>
        <h1>Log Volunteer Hours</h1>
        <p>Record your volunteer hours for approved opportunities.</p>
      </section>

      <div id="message" role="status" aria-live="polite"></div>

      <section>
        <form id="logHoursForm">
          <div class="form-grid">
            <div class="form-section form-full-width">
              <label for="opportunityId">
                Opportunity
                <select id="opportunityId" name="opportunityId" required>
                  <option value="" disabled selected>Select an opportunity</option>
                </select>
              </label>
            </div>

            <div class="form-section">
              <label for="date">
                Date
                <input type="date" id="date" name="date" max="" required />
              </label>
            </div>

            <div class="form-section">
              <label for="hours">
                Hours
                <input
                  type="number"
                  id="hours"
                  name="hours"
                  step="0.5"
                  min="0.5"
                  max="24"
                  aria-describedby="hoursHint"
                  required
                />
                <small id="hoursHint">Enter hours between 0.5 and 24</small>
              </label>
            </div>
          </div>

          <button type="submit" id="submitButton">Log Hours</button>
        </form>
      </section>

      <section id="recent-hours">
        <h2>Recent Hours</h2>
        <table>
            <caption>Recent hours</caption>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Opportunity</th>
              <th scope="col">Hours</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="hoursTableBody">
            <tr>
              <td colspan="4">Loading...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer class="container">
      <small>&copy; 2025 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/volunteer/log-hours.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
      <script type="module" src="/js/components/volunteerNav.js"></script>
  </body>
</html>
