  <body>
        <header class="site-header">
      <nav class="site-nav container" aria-label="Volunteer navigation">
        <a class="site-brand" href="/pages/volunteer/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <ul class="nav-menu" id="navMenu" data-volunteer-nav></ul>
        <button id="logoutButton" class="secondary">Sign out</button>
      </nav>
    </header>

    <main class="container">
      <header class="page-header">
        <h1>Find a shift</h1>
        <p class="lead">Open shifts at the sanctuary, soonest first. Tap one to see the details and apply.</p>
      </header>

      <section class="ruled-panel browse-filters" aria-label="Filter shifts">
        <div class="filter-grid">
          <label for="filter_search" class="filter-search">
            Search
            <input
              type="text"
              id="filter_search"
              name="search"
              class="search-input"
              placeholder="Shift name or place"
              autocomplete="off"
            />
          </label>
          <label for="filter_from">
            From
            <input type="date" id="filter_from" name="from" />
          </label>
          <label for="filter_to">
            To
            <input type="date" id="filter_to" name="to" />
          </label>
          <label for="filter_hours">
            Hours
            <select id="filter_hours" name="hours">
              <option value="">Any hours</option>
              <option value="under5">Under 5 hrs per week</option>
              <option value="5to15">5 to 15 hrs per week</option>
              <option value="15plus">15 or more hrs per week</option>
            </select>
          </label>
          <label for="filter_tag">
            Interest
            <select id="filter_tag" name="tag">
              <option value="">Any interest</option>
            </select>
          </label>
        </div>
        <div class="clear-filters-wrap" id="clearFiltersWrap" style="display: none;">
          <button type="button" id="clearFiltersButton" class="secondary button-secondary">Clear all filters</button>
        </div>
      </section>

      <p id="shiftsStatus" class="browse-status muted" role="status">Loading shifts</p>

      <section id="coverShiftsSection" class="ruled-panel needs-you" style="display:none;" aria-labelledby="coverTitle">
        <header class="ruled-panel-head">
          <h2 id="coverTitle">Cover a shift</h2>
          <span class="muted">These volunteers need someone to take their place.</span>
        </header>
        <div id="cover-shifts-container" class="cover-shifts"></div>
      </section>

      <section>
        <div id="shifts-container" class="shift-groups"></div>
        <div id="emptyState" class="ruled-panel empty-state browse-empty-state" style="display: none;">
          <p>No shifts match your search.</p>
          <button type="button" id="emptyStateClearButton" class="secondary">Clear the filters</button>
        </div>
      </section>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/utils/errorHandler.js"></script>

  </body>
