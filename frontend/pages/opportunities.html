<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open shifts - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Public navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation">Menu</button>
        <ul class="nav-menu" id="navMenu">
          <li><a class="nav-link" href="/pages/opportunities.html" aria-current="page">Open shifts</a></li>
          <li><a class="nav-link" href="/login.html">Log in</a></li>
          <li><a class="nav-link" href="/register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section>
        <h1>Open volunteer shifts</h1>
        <p>Browse upcoming opportunities at Assisi Animal Sanctuary. Create an account to apply.</p>
        <p>
          <a href="/api/public/opportunities.ics">Subscribe via calendar (.ics)</a>
          ·
          <a href="/pages/group-booking.html">Request a group visit</a>
        </p>
      </section>
      <section id="opportunitiesList">
        <p>Loading open shifts...</p>
      </section>
    </main>

    <footer class="container">
      <small>&copy; 2025 ShelterLink</small>
    </footer>

    <script>
      (() => {
        const nav = document.querySelector('.site-nav');
        const toggle = nav?.querySelector('.nav-toggle');
        if (!nav || !toggle) return;
        toggle.addEventListener('click', () => {
          const open = nav.classList.toggle('nav-open');
          toggle.setAttribute('aria-expanded', String(open));
        });
      })();
    </script>
    <script type="module" src="/js/public/opportunities.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
