  <head>

    <meta name="description" content="Companies and schools can request a group slot. It is reserved only after an administrator confirms." />

    <link rel="preload" href="/public/fonts/atkinson-hyperlegible-next-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/public/fonts/young-serif-400.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="modulepreload" href="/js/brandCache.js">
    <link rel="modulepreload" href="/js/components/icons.js">
    <link rel="modulepreload" href="/js/components/publicNav.js">
    <link rel="modulepreload" href="/js/components/statusBanner.js">
    <link rel="modulepreload" href="/js/public/group-booking.js">
    <link rel="modulepreload" href="/js/public/publicBoard.js">

  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Main navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <ul class="nav-menu" id="navMenu">
          <li><a class="nav-link" href="/pages/opportunities.html">Open shifts</a></li>
          <li><a class="nav-link" href="/login.html">Sign in</a></li>
          <li><a class="nav-link" href="/register.html">Register</a></li>
        </ul>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">Menu</button>
      </nav>
    </header>

    <main class="container">
      <div class="auth-card auth-card--wide">
        <h1>Ask about a group visit</h1>
        <p class="lead">Companies and schools can ask for a group slot on an open shift. The places are only held once a member of staff confirms.</p>
        <div id="message" role="status" aria-live="polite"></div>

        <form id="groupBookingForm">
          <div class="visually-hidden" aria-hidden="true">
            <label for="faxExtension">
              Fax extension
              <input type="text" id="faxExtension" name="fax_extension" tabindex="-1" autocomplete="off" />
            </label>
          </div>
          <input type="hidden" id="startedAt" name="started_at" />
          <label for="opportunityId">
            Shift
            <select id="opportunityId" name="opportunity_id" required>
              <option value="">Loading shifts</option>
            </select>
          </label>
          <label for="groupName">
            Group or organisation name
            <input type="text" id="groupName" name="group_name" required maxlength="255" autocomplete="organization" />
          </label>
          <div class="field-pair">
            <label for="contactName">
              Contact name
              <input type="text" id="contactName" name="contact_name" required maxlength="255" autocomplete="name" />
            </label>
            <label for="contactEmail">
              Contact email
              <input type="email" id="contactEmail" name="contact_email" required maxlength="255" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" />
            </label>
          </div>
          <label for="groupSize" class="field-narrow">
            How many people
            <input type="number" id="groupSize" name="size" min="1" step="1" required inputmode="numeric" />
          </label>
          <label for="notes">
            Anything staff should know (optional)
            <textarea id="notes" name="notes" rows="3"></textarea>
          </label>
          <button type="submit">Send request</button>
        </form>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/components/publicNav.js"></script>
    <script type="module" src="/js/public/group-booking.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
