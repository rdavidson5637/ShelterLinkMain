  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Public navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation">Menu</button>
        <ul class="nav-menu" id="navMenu">
          <li><a class="nav-link" href="/pages/opportunities.html">Open shifts</a></li>
          <li><a class="nav-link" href="/pages/group-booking.html" aria-current="page">Group booking</a></li>
          <li><a class="nav-link" href="/login.html">Sign in</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="container">
      <section>
        <h1>Request a group visit</h1>
        <p>
          Companies and schools can request a group slot on an open opportunity.
          Your group size is reserved only after an administrator confirms.
        </p>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

      <section>
        <form id="groupBookingForm">
          <div class="visually-hidden" aria-hidden="true">
            <label for="faxExtension">
              Fax extension
              <input type="text" id="faxExtension" name="fax_extension" tabindex="-1" autocomplete="off" />
            </label>
          </div>
          <input type="hidden" id="startedAt" name="started_at" />
          <label for="opportunityId">
            Opportunity
            <select id="opportunityId" name="opportunity_id" required>
              <option value="">Loading opportunities…</option>
            </select>
          </label>
          <label for="groupName">
            Group / organisation name
            <input type="text" id="groupName" name="group_name" required maxlength="255" autocomplete="organization" />
          </label>
          <label for="contactName">
            Contact name
            <input type="text" id="contactName" name="contact_name" required maxlength="255" autocomplete="name" />
          </label>
          <label for="contactEmail">
            Contact email
            <input type="email" id="contactEmail" name="contact_email" required maxlength="255" autocomplete="email" />
          </label>
          <label for="groupSize">
            Group size
            <input type="number" id="groupSize" name="size" min="1" step="1" required />
          </label>
          <label for="notes">
            Notes (optional)
            <textarea id="notes" name="notes" rows="3"></textarea>
          </label>
          <button type="submit">Submit request</button>
        </form>
      </section>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/components/publicNav.js"></script>
    <script type="module" src="/js/public/group-booking.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
