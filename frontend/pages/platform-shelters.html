<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Shelter applications - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/vendor/pico-2.1.1.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Account">
        <a class="site-brand" href="/pages/admin/dashboard.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <button id="logoutButton" class="secondary">Logout</button>
      </nav>
    </header>

    <main class="container">
      <section>
        <h1>Shelter applications</h1>
        <p>Platform owner only. Check the charity register result, then approve or reject.</p>
      </section>

      <section>
        <label for="statusFilter">
          Show
          <select id="statusFilter">
            <option value="pending" selected>Waiting for a decision</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="all">All</option>
          </select>
        </label>
      </section>

      <section id="message" aria-live="polite"></section>

      <section class="table-wrapper">
        <table>
          <caption>Applications</caption>
          <thead>
            <tr>
              <th scope="col">Shelter</th>
              <th scope="col">Slug</th>
              <th scope="col">Applicant</th>
              <th scope="col">Charity register</th>
              <th scope="col">Received</th>
              <th scope="col">Status</th>
              <th scope="col">Decision</th>
            </tr>
          </thead>
          <tbody id="applicationsBody">
            <tr><td colspan="7">Loading...</td></tr>
          </tbody>
        </table>
      </section>

      <section class="table-wrapper">
        <table>
          <caption>Shelters</caption>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Slug</th>
              <th scope="col">Charity</th>
              <th scope="col">Status</th>
              <th scope="col">Created</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="sheltersBody">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer class="container" data-site-footer></footer>
    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/utils/sessionManager.js"></script>
    <script type="module" src="/js/platform/shelters.js"></script>
    <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
