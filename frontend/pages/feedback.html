<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shift Feedback | ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
    <style>
      .star-rating {
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
        margin: 0.75rem 0 1rem;
      }
      .star-rating button {
        width: 2.75rem;
        height: 2.75rem;
        padding: 0;
        font-size: 1.5rem;
        line-height: 1;
        border-radius: 0.35rem;
        background: transparent;
        border: 1px solid var(--pico-muted-border-color, #ccc);
        color: #888;
        cursor: pointer;
      }
      .star-rating button[aria-checked="true"],
      .star-rating button.active {
        color: #c47b16;
        border-color: #c47b16;
        background: rgba(196, 123, 22, 0.08);
      }
      .star-rating button:focus-visible {
        outline: 2px solid #c47b16;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="container" style="max-width: 560px; margin: 2rem auto;">
      <h1>How was your shift?</h1>
      <p id="shiftSummary">Loading…</p>
      <div id="message" role="status" aria-live="polite"></div>

      <form id="feedbackForm" hidden>
        <fieldset>
          <legend>Rating</legend>
          <div class="star-rating" role="radiogroup" aria-label="Rating from 1 to 5" id="starRating">
            <button type="button" data-value="1" aria-checked="false" aria-label="1 star">★</button>
            <button type="button" data-value="2" aria-checked="false" aria-label="2 stars">★</button>
            <button type="button" data-value="3" aria-checked="false" aria-label="3 stars">★</button>
            <button type="button" data-value="4" aria-checked="false" aria-label="4 stars">★</button>
            <button type="button" data-value="5" aria-checked="false" aria-label="5 stars">★</button>
          </div>
          <input type="hidden" id="rating" name="rating" required />
        </fieldset>

        <label for="comment">
          Comment (optional)
          <textarea id="comment" name="comment" rows="4" maxlength="5000" placeholder="Anything we should know?"></textarea>
        </label>

        <label>
          <input type="checkbox" id="flag_concern" name="flag_concern" />
          Something needs attention
        </label>

        <button type="submit" id="submitButton">Submit feedback</button>
      </form>
    </main>

    <script type="module" src="/js/feedback.js"></script>
  </body>
</html>
