<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shift feedback - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
    <main class="container" style="max-width: 560px; margin: 2rem auto;">
      <h1>How was your shift?</h1>
      <p id="shiftSummary">Loading…</p>
      <div id="message" role="status" aria-live="polite"></div>

      <form id="feedbackForm" hidden>
        <fieldset>
          <legend>Rating</legend>
          <div class="star-rating" role="radiogroup" aria-label="Rating from 1 to 5" id="starRating">
            <label>
              <input type="radio" name="rating" id="rating-1" value="1" />
              <span class="star-face" aria-hidden="true">★</span>
              <span class="visually-hidden">1 star</span>
            </label>
            <label>
              <input type="radio" name="rating" id="rating-2" value="2" />
              <span class="star-face" aria-hidden="true">★</span>
              <span class="visually-hidden">2 stars</span>
            </label>
            <label>
              <input type="radio" name="rating" id="rating-3" value="3" />
              <span class="star-face" aria-hidden="true">★</span>
              <span class="visually-hidden">3 stars</span>
            </label>
            <label>
              <input type="radio" name="rating" id="rating-4" value="4" />
              <span class="star-face" aria-hidden="true">★</span>
              <span class="visually-hidden">4 stars</span>
            </label>
            <label>
              <input type="radio" name="rating" id="rating-5" value="5" />
              <span class="star-face" aria-hidden="true">★</span>
              <span class="visually-hidden">5 stars</span>
            </label>
          </div>
        </fieldset>

        <label for="comment">
          Comment (optional)
          <textarea id="comment" name="comment" rows="4" maxlength="5000" placeholder="Anything we should know?"></textarea>
        </label>

        <label>
          <input type="checkbox" id="flag_concern" name="flag_concern" />
          Something needs attention
        </label>

        <button type="submit" id="submitButton">Submit feedback</button>
      </form>
    </main>

    
    <footer class="container" data-site-footer></footer>
<script type="module" src="/js/feedback.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
