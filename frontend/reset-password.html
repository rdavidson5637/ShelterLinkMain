<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password - ShelterLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/css/custom.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Main navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
      </nav>
    </header>

    <main class="container">
      <article class="auth-card">
        <h1>Reset Your Password</h1>
        <p>Enter a new password for your account.</p>

        <div id="message" role="status" aria-live="polite"></div>

        <form id="resetForm">
          <label for="password">
            New Password
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              autocomplete="new-password"
              aria-describedby="passwordHint"
            />
            <small id="passwordHint">At least 8 characters, one uppercase letter, one number.</small>
          </label>

          <label for="confirm_password">
            Confirm New Password
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </label>

          <button type="submit" id="submitButton">Set New Password</button>
        </form>

        <p class="auth-links" id="loginLink" style="display:none;">
          <a href="/login.html">Back to Sign In</a>
        </p>
      </article>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink : Assisi Animal Sanctuary</small>
    </footer>

    <script type="module">
      import { apiRequest } from '/js/config.js';
      import { showFormErrors, clearFormErrors } from '/js/utils/formErrors.js';

      const form = document.getElementById('resetForm');
      const messageEl = document.getElementById('message');
      const submitButton = document.getElementById('submitButton');
      const loginLink = document.getElementById('loginLink');

      function showMessage(text, type = 'info') {
        const color = type === 'error' ? '#d93025' : type === 'success' ? '#0f9d58' : '#1a73e8';
        messageEl.innerHTML = `<p style="color:${color};padding:0.75rem;border-radius:6px;background:${color}18;">${text}</p>`;
      }

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        showMessage('Invalid reset link. Please request a new password reset.', 'error');
        form.style.display = 'none';
        loginLink.style.display = 'block';
      } else {
        try {
          const check = await apiRequest(`/auth/reset-password/${encodeURIComponent(token)}`);
          const checkData = await check.json().catch(() => ({ valid: false }));
          if (!checkData.valid) {
            showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
            form.style.display = 'none';
            loginLink.style.display = 'block';
          }
        } catch {
          showMessage('Unable to verify this reset link. Please try again.', 'error');
          form.style.display = 'none';
          loginLink.style.display = 'block';
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFormErrors(form);

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;

        if (password !== confirm) {
          showFormErrors(form, [{ field: 'confirm_password', message: 'Passwords do not match.' }]);
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Updating…';
        messageEl.innerHTML = '';

        try {
          const res = await apiRequest('/auth/reset-password', {
            method: 'POST',
            body: { token, password },
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            showMessage('Password updated successfully! Redirecting to sign in…', 'success');
            form.style.display = 'none';
            loginLink.style.display = 'block';
            setTimeout(() => { window.location.href = '/login.html'; }, 2500);
          } else {
            showFormErrors(form, [{ field: 'password', message: data.error || 'Something went wrong. Please try again.' }]);
            submitButton.disabled = false;
            submitButton.textContent = 'Set New Password';
          }
        } catch (err) {
          showFormErrors(form, [{ message: 'Network error. Please check your connection and try again.' }]);
          submitButton.disabled = false;
          submitButton.textContent = 'Set New Password';
        }
      });
    </script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
