<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F5C45" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Offline - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/custom.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: var(--page-bg);
        color: var(--text);
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        color: var(--green);
        margin-bottom: 0.5rem;
      }
    </style>
    <!-- preload:start -->
    <link rel="preload" href="/public/fonts/atkinson-hyperlegible-next-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/public/fonts/young-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="/js/offlinePage.js">
    <!-- preload:end -->
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Main navigation">
        <a class="site-brand" href="/launch">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
      </nav>
    </header>

    <main class="container auth-card error-page">
      <h1>You are offline</h1>
      <p class="lead">This page is not saved on this phone yet. Pages you opened recently, like your home page, still work.</p>
      <p class="actions"><button type="button">Try again</button></p>
    </main>
    <script type="module" src="/js/offlinePage.js"></script>
  </body>
</html>
