<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="%%SHELTER_PRIMARY_COLOUR%%" />
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ShelterLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Offline - ShelterLink</title>
    <link rel="stylesheet" href="/public/css/custom.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f6f7f6;
        color: #1c211e;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        color: #1b5e20;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page isn't saved on this phone yet. Pages you've opened recently, like your dashboard, still work.</p>
      <p><button type="button">Try again</button></p>
    </main>
    <script type="module" src="/js/offlinePage.js"></script>
  </body>
</html>
