  <head>

    <meta name="apple-mobile-web-app-title" content="ShelterLink" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="description" content="Create a ShelterLink account to apply for shifts at Assisi Animal Sanctuary." />

    <link rel="preload" href="/public/fonts/atkinson-hyperlegible-next-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/public/fonts/young-serif-400.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="modulepreload" href="/js/authMe.js">
    <link rel="modulepreload" href="/js/brand.js">
    <link rel="modulepreload" href="/js/brandCache.js">
    <link rel="modulepreload" href="/js/components/icons.js">
    <link rel="modulepreload" href="/js/components/publicNav.js">
    <link rel="modulepreload" href="/js/components/statusBanner.js">
    <link rel="modulepreload" href="/js/config.js">
    <link rel="modulepreload" href="/js/pwa.js">
    <link rel="modulepreload" href="/js/register.js">
    <link rel="modulepreload" href="/js/utils/apiErrorPolicy.js">
    <link rel="modulepreload" href="/js/utils/errorHandler.js">
    <link rel="modulepreload" href="/js/utils/footerYear.js">

  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container" aria-label="Main navigation">
        <a class="site-brand" href="/index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>ShelterLink</strong>
        </a>
        <ul class="nav-menu" id="navMenu">
          <li><a class="nav-link" href="/pages/opportunities.html">Open shifts</a></li>
          <li><a class="nav-link" href="/login.html">Sign in</a></li>
        </ul>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navMenu">Menu</button>
      </nav>
    </header>

    <main class="container">
      <div class="auth-card auth-card--wide">
        <h1>Create an account</h1>
        <p class="lead">Make an account to apply for shifts at <span data-shelter-name>Assisi Animal Sanctuary</span>. Staff check every new volunteer before their first shift.</p>

        <div id="message" role="status" aria-live="polite"></div>

        <form id="registerForm">
          <div class="field-pair">
            <label for="first_name">
              First name
              <input type="text" id="first_name" name="first_name" required autocomplete="given-name" />
            </label>

            <label for="last_name">
              Last name
              <input type="text" id="last_name" name="last_name" required autocomplete="family-name" />
            </label>
          </div>

          <div class="field-pair">
            <label for="email">
              Email address
              <input type="email" id="email" name="email" required autocomplete="email" />
            </label>

            <label for="phone">
              Phone number
              <input type="tel" id="phone" name="phone" required autocomplete="tel" />
            </label>
          </div>

          <div class="field-pair">
            <label for="password">
              Password
              <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
            </label>

            <label for="confirm_password">
              Confirm password
              <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password" />
            </label>
          </div>

          <label for="privacy_notice" class="check">
            <input type="checkbox" id="privacy_notice" name="privacy_notice" />
            I have read the <a href="/pages/privacy.html">privacy notice</a>
          </label>

          <button type="submit">Create account</button>
        </form>

        <p class="auth-links muted">
          Already registered? <a href="/login.html">Sign in</a>
        </p>
      </div>
    </main>

    <footer class="container">
      <small>&copy; 2026 ShelterLink</small>
    </footer>

    <script type="module" src="/js/components/publicNav.js"></script>
    <script type="module" src="/js/utils/errorHandler.js"></script>
    <script type="module" src="/js/register.js"></script>
      <script type="module" src="/js/utils/footerYear.js"></script>
  </body>
</html>
