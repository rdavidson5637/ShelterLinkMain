name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 matches the Dockerfile, and its test runner expands the
          # quoted "test/*.test.js" glob itself (Node 20 does not).
          node-version-file: .nvmrc
          cache: npm
      - run: node --version
      - run: npm ci
      # The unit tests run against an in-process mock DB (test/helpers/mockDb.js),
      # so no Postgres service is needed here.
      - run: npm test
