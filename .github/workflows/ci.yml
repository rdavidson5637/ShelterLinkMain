name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 matches the Dockerfile, and its test runner expands the
          # quoted "test/*.test.js" glob itself (Node 20 does not).
          node-version-file: .nvmrc
          cache: npm
      - run: node --version
      - run: npm ci
      # Vendor Pico/FullCalendar (postinstall) and render A2 icons so tests
      # that stat files under frontend/public pass without committed blobs.
      - run: npm run icons
      # Unit tests use an in-process mock DB. The tenant isolation test uses the
      # Postgres service above and refuses any host that is not localhost.
      - run: npm test
        env:
          TENANT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shelterlink_tenant_test
