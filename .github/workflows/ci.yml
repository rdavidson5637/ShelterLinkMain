name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The 247 unit tests run against an in-process mock DB (test/helpers/mockDb.js),
      # so no Postgres service is needed here.
      - run: npm test
