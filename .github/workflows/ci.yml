name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Vendor Pico/FullCalendar (postinstall) and render A2 icons so tests
      # that stat files under frontend/public pass without committed blobs.
      - run: npm run icons
      # Unit tests run against an in-process mock DB (test/helpers/mockDb.js),
      # so no Postgres service is needed here. 350 tests, including the PWA/push suite.
      - run: npm test
